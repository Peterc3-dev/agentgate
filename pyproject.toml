[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyagentgate"
version = "0.1.0"
description = "Open-source policy engine for agentic payments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Peter C. Clemente III" }]
keywords = ["agent", "payments", "policy", "authorization", "fintech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Security",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.urls]
Repository = "https://github.com/Peterc3-dev/agentgate"

[tool.hatch.build.targets.wheel]
packages = ["agentgate"]
